<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Anatomy Heart</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
  radial-gradient(circle at center,
  #122033 0%,
  #050b14 40%,
  #000000 100%);
}

/* نور پشت قلب */
.glow{
  position:absolute;

  width:350px;
  height:350px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  rgba(80,180,255,.35) 0%,
  rgba(80,180,255,.08) 40%,
  transparent 70%);

  filter:blur(40px);

  animation:pulse 4s ease-in-out infinite;
}

/* قلب */
.heart{
  position:relative;
  z-index:2;

  width:220px;

  animation:
  breathe 3s ease-in-out infinite,
  floatHeart 5s ease-in-out infinite;

  filter:
  drop-shadow(0 0 10px #69c7ff)
  drop-shadow(0 0 25px #4da6ff)
  drop-shadow(0 0 40px rgba(77,166,255,.6));
}

/* تصویر قلب */
.heart img{
  width:100%;
  display:block;

  opacity:.95;
}

/* ذرات */
.particle{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#7fd3ff;

  box-shadow:
  0 0 10px #7fd3ff,
  0 0 20px #4da6ff;

  opacity:0;

  animation:
  move linear infinite;
}

/* امضا */
.signature{
  position:fixed;
  bottom:12px;
  width:100%;

  text-align:center;

  color:rgba(180,220,255,.35);

  font-family:Arial;
  font-size:11px;
  letter-spacing:4px;
}

/* نفس */
@keyframes breathe{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.05);
  }
}

/* شناوری */
@keyframes floatHeart{
  0%,100%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-6px);
  }
}

/* نور */
@keyframes pulse{
  0%,100%{
    transform:scale(1);
    opacity:.7;
  }

  50%{
    transform:scale(1.08);
    opacity:1;
  }
}

/* ذرات */
@keyframes move{

  0%{
    transform:
    translate(0,0)
    scale(.2);

    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:
    translate(var(--x),var(--y))
    scale(1.3);

    opacity:0;
  }
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="heart">

<img src="https://i.imgur.com/6qK0F9Y.png">

</div>

<div class="signature">MAMALI</div>

<script>

/* ذرات */
for(let i=0;i<55;i++){

  const p = document.createElement("div");

  p.className = "particle";

  p.style.left = "50%";
  p.style.top = "50%";

  p.style.setProperty(
    "--x",
    (Math.random()*260-130)+"px"
  );

  p.style.setProperty(
    "--y",
    (Math.random()*260-130)+"px"
  );

  p.style.animationDuration =
  (2+Math.random()*3)+"s";

  p.style.animationDelay =
  (Math.random()*3)+"s";

  document.body.appendChild(p);
}

</script>

</body>
</html>
