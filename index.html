<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Breathing Blue Heart</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* قلب */
.heart{
  position:relative;
  font-size:160px;
  animation: breathe 2.5s infinite ease-in-out;
  filter: drop-shadow(0 0 15px #4da6ff)
          drop-shadow(0 0 40px #1a75ff);
  z-index:2;
}

/* نفس کشیدن */
@keyframes breathe{
  0%,100% { transform:scale(1); }
  50%     { transform:scale(1.15); }
}

/* ذرات */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:#4da6ff;
  border-radius:50%;
  box-shadow:0 0 10px #4da6ff;
  animation: float 3s infinite linear;
  opacity:0.8;
}

@keyframes float{
  0%{
    transform:translate(0,0);
    opacity:0;
  }
  20%{opacity:1;}
  100%{
    transform:translate(calc(-50px + 100px * var(--x)), 
                        calc(-50px + 100px * var(--y)));
    opacity:0;
  }
}

/* امضا */
.signature{
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
  color:rgba(120,200,255,0.6);
  font-family:sans-serif;
  font-size:13px;
  letter-spacing:2px;
}
</style>
</head>

<body>

<div class="heart">🫀</div>
<div class="signature">MAMALI</div>

<script>
// ساخت ذرات آبی داخل قلب
const heart = document.querySelector('.heart');

for(let i=0;i<40;i++){
  let p = document.createElement('div');
  p.className = 'particle';

  p.style.left = (50 + (Math.random()*40 - 20)) + '%';
  p.style.top = (45 + (Math.random()*40 - 20)) + '%';

  p.style.setProperty('--x', Math.random());
  p.style.setProperty('--y', Math.random());

  p.style.animationDuration = (2 + Math.random()*3) + 's';
  p.style.animationDelay = (Math.random()*2) + 's';

  heart.appendChild(p);
}
</script>

</body>
</html>
