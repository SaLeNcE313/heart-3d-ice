<!DOCTYPE html><html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Heart Fixed</title>
<style>
body{
  margin:0;
  overflow:hidden;
  background:#000; /* مشکی واقعی */
}
canvas{position:absolute;top:0;left:0}
.signature{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
  color:rgba(0,255,255,0.6);
  text-shadow:0 0 15px cyan;
  letter-spacing:4px;
}
</style>
</head>
<body><canvas id="c"></canvas>

<div class="signature">SaLeNcE</div><script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=innerWidth;
canvas.height=innerHeight;

let t=0;
let mouseX=canvas.width/2;
let mouseY=canvas.height/2;

window.addEventListener('mousemove',e=>{
  mouseX=e.clientX;
  mouseY=e.clientY;
});

function drawHeart(x,y,scale,rot){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(rot);

  ctx.beginPath();
  for(let i=0;i<Math.PI*2;i+=0.01){
    let hx = 15*Math.pow(Math.sin(i),3);
    let hy = -(12*Math.cos(i)-5*Math.cos(2*i)-2*Math.cos(3*i)-Math.cos(4*i));
    ctx.lineTo(hx*scale,hy*scale);
  }
  ctx.closePath();

  // glow قوی‌تر
  ctx.shadowBlur = 60;
  ctx.shadowColor = "#00f0ff";

  let g = ctx.createRadialGradient(0,0,10,0,0,200);
  g.addColorStop(0,'#00ffff');
  g.addColorStop(1,'#003344');

  ctx.fillStyle=g;
  ctx.fill();

  // رگ‌ها (مثل عکس)
  ctx.strokeStyle='rgba(0,255,255,0.4)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=0;i<15;i++){
    ctx.moveTo(0,0);
    let angle = Math.random()*Math.PI*2;
    let r = 80*Math.random();
    ctx.lineTo(Math.cos(angle)*r, Math.sin(angle)*r);
  }
  ctx.stroke();

  ctx.restore();
}

// ستاره‌ها
let stars=[];
for(let i=0;i<200;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    s:Math.random()*2
  });
}

function drawStars(){
  stars.forEach(s=>{
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.s,0,Math.PI*2);
    ctx.fillStyle='rgba(0,255,255,0.8)';
    ctx.fill();
  });
}

function animate(){
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; /* فید نرم به جای سفید شدن */
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawStars();

  let scale=6 + Math.sin(t)*0.5;
  let rot=t*0.1;

  let dx=(mouseX-canvas.width/2)*0.03;
  let dy=(mouseY-canvas.height/2)*0.03;

  drawHeart(canvas.width/2+dx,canvas.height/2+dy,scale,rot);

  t+=0.03;
  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize',()=>{
  canvas.width=innerWidth;
  canvas.height=innerHeight;
});
</script></body>
</html>
