<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Anatomy Heart</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
  radial-gradient(circle at center,
  #1b2c45 0%,
  #0a1422 35%,
  #000000 100%);
}

/* نور محیط */
.glow{
  position:absolute;
  width:500px;
  height:500px;

  background:
  radial-gradient(circle,
  rgba(90,180,255,.25) 0%,
  rgba(90,180,255,.08) 40%,
  transparent 70%);

  filter:blur(50px);

  animation:pulseGlow 4s ease-in-out infinite;
}

/* قلب */
.heart{
  position:relative;
  width:260px;
  z-index:2;

  filter:
  drop-shadow(0 0 10px #6bc6ff)
  drop-shadow(0 0 25px #4da6ff)
  drop-shadow(0 0 45px rgba(77,166,255,.6));

  animation:
  breathe 3s ease-in-out infinite,
  floatHeart 5s ease-in-out infinite;
}

/* تصویر */
.heart img{
  width:100%;
  display:block;
  opacity:.95;
}

/* ذرات */
.particle{
  position:absolute;
  width:3px;
  height:3px;

  border-radius:50%;

  background:#8ad4ff;

  box-shadow:
  0 0 10px #6bc6ff,
  0 0 20px #4da6ff;

  opacity:0;

  animation:
  particleMove linear infinite;
}

/* امضا */
.signature{
  position:fixed;
  bottom:12px;
  width:100%;
  text-align:center;

  color:rgba(180,220,255,.4);

  font-family:Arial;
  font-size:12px;
  letter-spacing:4px;
}

/* نفس کشیدن */
@keyframes breathe{
  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.06);
  }
}

/* شناوری نرم */
@keyframes floatHeart{
  0%,100%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-6px);
  }
}

/* نور */
@keyframes pulseGlow{
  0%,100%{
    opacity:.7;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.08);
  }
}

/* حرکت ذرات */
@keyframes particleMove{

  0%{
    transform:
    translate(0,0)
    scale(.2);

    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:
    translate(var(--x),var(--y))
    scale(1.4);

    opacity:0;
  }
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="heart" id="heart">

<!-- قلب آناتومی واقعی -->
<img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Heart_anatomy.png">

</div>

<div class="signature">MAMALI</div>

<script>

for(let i=0;i<60;i++){

  const p = document.createElement("div");

  p.className = "particle";

  p.style.left = "50%";
  p.style.top = "50%";

  p.style.setProperty(
    "--x",
    (Math.random()*300-150)+"px"
  );

  p.style.setProperty(
    "--y",
    (Math.random()*300-150)+"px"
  );

  p.style.animationDuration =
  (2+Math.random()*3)+"s";

  p.style.animationDelay =
  (Math.random()*3)+"s";

  document.body.appendChild(p);
}

</script>

</body>
</html>
