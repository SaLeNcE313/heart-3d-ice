<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real Heart Pro</title>

<style>
  body { margin:0; overflow:hidden; background:black; }

  /* امضا */
  .signature {
    position: fixed;
    bottom: 15px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 14px;
    font-family: 'Segoe UI', sans-serif;
    letter-spacing: 2px;
  }
</style>
</head>

<body>

<div class="signature">MAMALI</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/loaders/GLTFLoader.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/postprocessing/UnrealBloomPass.js';

// صحنه
const scene = new THREE.Scene();

// دوربین
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.z = 3;

// رندر
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// نور سینمایی
const light1 = new THREE.PointLight(0xff0040, 4);
light1.position.set(2,2,3);
scene.add(light1);

const light2 = new THREE.PointLight(0xffffff, 2);
light2.position.set(-2,-1,2);
scene.add(light2);

scene.add(new THREE.AmbientLight(0x220000));

// افکت Bloom (درخشش)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  1.5, // شدت
  0.4,
  0.85
);
composer.addPass(bloom);

// لود مدل
const loader = new GLTFLoader();
let heart;

loader.load(
  'https://threejs.org/examples/models/gltf/Heart.glb',
  (gltf) => {
    heart = gltf.scene;

    heart.traverse((child) => {
      if (child.isMesh) {
        child.material.metalness = 0.8;
        child.material.roughness = 0.2;
        child.material.color.set(0xff1a4d);
      }
    });

    heart.scale.set(1.5,1.5,1.5);
    heart.rotation.x = Math.PI;

    scene.add(heart);
  }
);

// انیمیشن
function animate() {
  requestAnimationFrame(animate);

  if (heart) {
    heart.rotation.y += 0.01;

    let t = Date.now() * 0.002;

    // ضربان واقعی‌تر (دو مرحله‌ای)
    let beat =
      1 +
      Math.sin(t) * 0.08 +
      Math.sin(t * 2) * 0.04 +
      Math.sin(t * 0.5) * 0.02;

    heart.scale.set(beat, beat, beat);
  }

  composer.render();
}

animate();

// ریسپانسیو
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
