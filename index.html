<!DOCTYPE html><html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Heart Pro Rotation</title>
<style>
body{
  margin:0;
  overflow:hidden;
  background:#000;
}
canvas{position:absolute;top:0;left:0}
.signature{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
  color:rgba(0,255,255,0.7);
  text-shadow:0 0 15px cyan;
  letter-spacing:4px;
}
</style>
</head>
<body><canvas id="c"></canvas>

<div class="signature">SaLeNcE</div><script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
canvas.width=innerWidth;
canvas.height=innerHeight;

let t=0;
let mouseX=canvas.width/2;
let mouseY=canvas.height/2;

window.addEventListener('mousemove',e=>{
  mouseX=e.clientX;
  mouseY=e.clientY;
});

// ساخت قلب دقیق‌تر
function heartPoints(scale){
  let pts=[];
  for(let i=0;i<Math.PI*2;i+=0.02){
    let x = 16*Math.pow(Math.sin(i),3);
    let y = -(13*Math.cos(i)-5*Math.cos(2*i)-2*Math.cos(3*i)-Math.cos(4*i));
    pts.push({x:x*scale,y:y*scale});
  }
  return pts;
}

function drawHeart(x,y,scale,tilt){
  let pts = heartPoints(scale);

  ctx.save();
  ctx.translate(x,y);

  // چرخش ایستاده (tilt سه‌بعدی فیک)
  ctx.transform(1, 0, tilt, 1, 0, 0);

  ctx.beginPath();
  pts.forEach((p,i)=>{
    if(i===0) ctx.moveTo(p.x,p.y);
    else ctx.lineTo(p.x,p.y);
  });
  ctx.closePath();

  // نور اصلی
  ctx.shadowBlur = 50;
  ctx.shadowColor = "#00f0ff";

  let g = ctx.createRadialGradient(0,0,10,0,0,200);
  g.addColorStop(0,'#00f0ff');
  g.addColorStop(1,'#001a2f');

  ctx.fillStyle = g;
  ctx.fill();

  // رگ‌های نوری مثل عکس
  ctx.strokeStyle='rgba(0,255,255,0.5)';
  ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=0;i<20;i++){
    ctx.moveTo(0,0);
    let p = pts[Math.floor(Math.random()*pts.length)];
    ctx.lineTo(p.x,p.y);
  }
  ctx.stroke();

  ctx.restore();
}

// ستاره‌ها
let stars=[];
for(let i=0;i<250;i++){
  stars.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    s:Math.random()*2
  });
}

function drawStars(){
  stars.forEach(s=>{
    let dx=(mouseX-canvas.width/2)*0.0008;
    let dy=(mouseY-canvas.height/2)*0.0008;

    ctx.beginPath();
    ctx.arc(s.x+dx,s.y+dy,s.s,0,Math.PI*2);
    ctx.fillStyle='rgba(0,255,255,0.8)';
    ctx.fill();
  });
}

function animate(){
  ctx.fillStyle='rgba(0,0,0,0.3)';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  drawStars();

  // ضربان
  let scale = 5.5 + Math.sin(t)*0.4;

  // چرخش ایستاده نرم (نه برعکس شدن)
  let tilt = Math.sin(t*0.5) * 0.3;

  let dx=(mouseX-canvas.width/2)*0.03;
  let dy=(mouseY-canvas.height/2)*0.03;

  drawHeart(canvas.width/2+dx, canvas.height/2+dy, scale, tilt);

  t+=0.04;
  requestAnimationFrame(animate);
}

animate();

window.addEventListener('resize',()=>{
  canvas.width=innerWidth;
  canvas.height=innerHeight;
});
</script></body>
</html>
