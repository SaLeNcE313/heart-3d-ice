<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinematic Blue Heart Film</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at center, #02040a, #000000);
}

/* امضا */
.signature{
  position:fixed;
  bottom:12px;
  width:100%;
  text-align:center;
  color:rgba(120,200,255,0.5);
  font-family:Arial;
  font-size:13px;
  letter-spacing:3px;
}
</style>
</head>

<body>
<div class="signature">MAMALI</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/loaders/GLTFLoader.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/postprocessing/UnrealBloomPass.js';

// Scene
const scene = new THREE.Scene();

// Camera (cinematic lens feel)
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0,0,3.2);

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 🌌 نور سینمایی حجمی‌طور (fake volumetric)
const keyLight = new THREE.PointLight(0x4da6ff, 6);
keyLight.position.set(3,2,3);
scene.add(keyLight);

const rimLight = new THREE.PointLight(0x1a75ff, 4);
rimLight.position.set(-3,-2,2);
scene.add(rimLight);

// ambient dark blue
scene.add(new THREE.AmbientLight(0x000a1a));

// 🎬 Bloom سینمایی قوی‌تر
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  3.0,   // intensity بالا برای فیلمی شدن
  0.3,
  0.75
);
composer.addPass(bloom);

// ❤️ قلب واقعی
const loader = new GLTFLoader();

let heart;

loader.load(
  'https://threejs.org/examples/models/gltf/Heart.glb',
  (gltf)=>{

    heart = gltf.scene;

    heart.traverse((o)=>{
      if(o.isMesh){
        o.material.color = new THREE.Color(0x4da6ff);
        o.material.emissive = new THREE.Color(0x1a75ff);
        o.material.emissiveIntensity = 2.0; // glow قوی‌تر
        o.material.metalness = 0.3;
        o.material.roughness = 0.08;
      }
    });

    heart.scale.set(1.8,1.8,1.8);
    scene.add(heart);
  }
);

// 🎥 انیمیشن سینمایی (breathing + camera drift)
function animate(){
  requestAnimationFrame(animate);

  let t = Date.now()*0.0018;

  if(heart){

    // ضربان واقعی‌تر
    let beat =
      1 +
      Math.sin(t)*0.07 +
      Math.sin(t*2)*0.025;

    heart.scale.set(beat,beat,beat);

    // چرخش خیلی نرم
    heart.rotation.y += 0.004;

    // حرکت “دوربین‌گونه” (حس فیلمی)
    heart.position.x = Math.sin(t*0.3)*0.03;
    heart.position.y = Math.cos(t*0.4)*0.03;
  }

  // حرکت نرم دوربین (خیلی مهم برای cinematic feel)
  camera.position.x = Math.sin(t*0.2)*0.05;
  camera.position.y = Math.cos(t*0.25)*0.05;
  camera.lookAt(0,0,0);

  composer.render();
}

animate();

// resize
addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>

</body>
</html>
