<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blue Heart Safe</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at center, #02040a, #000000);
}

canvas{ display:block; }

.signature{
  position:fixed;
  bottom:10px;
  width:100%;
  text-align:center;
  color:rgba(120,200,255,0.6);
  font-family:Arial;
  font-size:13px;
  letter-spacing:2px;
}
</style>
</head>

<body>
<div class="signature">MAMALI</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.z = 6;

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Light
const light = new THREE.PointLight(0x4da6ff, 3);
light.position.set(2,2,3);
scene.add(light);

scene.add(new THREE.AmbientLight(0x001122));

// 💙 قلب واقعی بدون مدل خارجی (geometry)
let shape = new THREE.Shape();

shape.moveTo(0,0);
shape.bezierCurveTo(0,2,-2,2,-2,0);
shape.bezierCurveTo(-2,-2,0,-3,0,-4);
shape.bezierCurveTo(0,-3,2,-2,2,0);
shape.bezierCurveTo(2,2,0,2,0,0);

let geometry = new THREE.ExtrudeGeometry(shape,{
  depth:1.5,
  bevelEnabled:true,
  bevelSize:0.4,
  bevelThickness:0.4
});

let material = new THREE.MeshStandardMaterial({
  color:0x4da6ff,
  emissive:0x1a75ff,
  emissiveIntensity:1.2,
  metalness:0.2,
  roughness:0.2
});

let heart = new THREE.Mesh(geometry, material);
scene.add(heart);

// 💓 animation
function animate(){
  requestAnimationFrame(animate);

  let t = Date.now()*0.002;

  let beat = 1 + Math.sin(t)*0.08;

  heart.scale.set(beat,beat,beat);

  heart.rotation.y += 0.008;

  renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>

</body>
</html>
