<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultimate Blue Anatomy Heart</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at center, #02030a, #000000);
}

/* امضا */
.signature{
  position:fixed;
  bottom:12px;
  width:100%;
  text-align:center;
  color:rgba(120,200,255,0.6);
  font-family:Arial;
  font-size:13px;
  letter-spacing:2px;
}
</style>
</head>

<body>

<div class="signature">MAMALI</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/loaders/GLTFLoader.js';
import { EffectComposer } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/postprocessing/UnrealBloomPass.js';

// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.z = 3;

// Renderer
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

// 💡 نور سینمایی چندلایه
const keyLight = new THREE.PointLight(0x4da6ff, 5);
keyLight.position.set(3,3,3);
scene.add(keyLight);

const fillLight = new THREE.PointLight(0x1a75ff, 3);
fillLight.position.set(-3,-2,2);
scene.add(fillLight);

scene.add(new THREE.AmbientLight(0x001020));

// ✨ Bloom حرفه‌ای (کلید سینمایی شدن)
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  2.5,   // intensity
  0.35,
  0.8
);
composer.addPass(bloom);

// ❤️ قلب واقعی
const loader = new GLTFLoader();

let heart;

loader.load(
  'https://threejs.org/examples/models/gltf/Heart.glb',
  (gltf)=>{

    heart = gltf.scene;

    heart.traverse((o)=>{
      if(o.isMesh){
        o.material.color = new THREE.Color(0x4da6ff);
        o.material.emissive = new THREE.Color(0x1a75ff);
        o.material.emissiveIntensity = 1.5;
        o.material.metalness = 0.25;
        o.material.roughness = 0.12;
      }
    });

    heart.scale.set(1.7,1.7,1.7);
    scene.add(heart);
  }
);

// 💓 انیمیشن سینمایی واقعی (breathing + float)
function animate(){
  requestAnimationFrame(animate);

  if(heart){

    let t = Date.now()*0.002;

    // نفس کشیدن طبیعی
    let beat =
      1 +
      Math.sin(t)*0.06 +
      Math.sin(t*2)*0.02;

    heart.scale.set(beat,beat,beat);

    // حرکت سینمایی نرم
    heart.rotation.y += 0.006;
    heart.position.y = Math.sin(t*0.5)*0.05;
  }

  composer.render();
}

animate();

// resize
addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>

</body>
</html>
