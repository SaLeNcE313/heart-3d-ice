<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real 3D Heart</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.128/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.128/examples/jsm/loaders/GLTFLoader.js';

// صحنه
const scene = new THREE.Scene();

// دوربین
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 3;

// رندر
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// نور حرفه‌ای
const light1 = new THREE.PointLight(0xff2a6d, 3, 10);
light1.position.set(2, 2, 3);
scene.add(light1);

const light2 = new THREE.PointLight(0xffffff, 1.5, 10);
light2.position.set(-2, -1, 2);
scene.add(light2);

// نور محیطی
scene.add(new THREE.AmbientLight(0x330000, 1));

// لودر مدل
const loader = new GLTFLoader();

let heart;

loader.load(
  'https://threejs.org/examples/models/gltf/Heart.glb', // مدل قلب
  function (gltf) {
    heart = gltf.scene;
    
    heart.scale.set(1.5, 1.5, 1.5);
    heart.rotation.x = Math.PI;

    scene.add(heart);
  }
);

// انیمیشن
function animate() {
  requestAnimationFrame(animate);

  if (heart) {
    // چرخش نرم
    heart.rotation.y += 0.01;

    // ضربان واقعی‌تر
    const t = Date.now() * 0.002;
    const beat = 1 + Math.sin(t) * 0.08 + Math.sin(t * 2) * 0.04;
    heart.scale.set(beat, beat, beat);
  }

  renderer.render(scene, camera);
}

animate();

// ریسپانسیو
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
