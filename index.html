<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ice Heart 3D</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at center, #05060a, #000);
}

.signature{
  position:absolute;
  bottom:15px;
  width:100%;
  text-align:center;
  color:rgba(155,231,255,0.5);
  font-family:sans-serif;
  font-size:12px;
  letter-spacing:4px;
  user-select:none;
}

canvas{
  display:block;
}
</style>
</head>

<body>

<div class="signature">— SaLeNcE —</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
// SCENE
const scene = new THREE.Scene();

// CAMERA
const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);
camera.position.z = 6;

// RENDERER
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHTS
const light = new THREE.PointLight(0x9be7ff, 2.5);
light.position.set(5,5,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0x3a6b8a, 1));

// HEART FUNCTION
function heartShape(t){
  return new THREE.Vector3(
    16*Math.pow(Math.sin(t),3),
    13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t),
    0
  );
}

// POINTS
let pts=[];
for(let i=0;i<300;i++){
  let t=i/300*Math.PI*2;
  let p=heartShape(t);
  pts.push(new THREE.Vector3(p.x*0.03,p.y*0.03,p.z*0.03));
}

const curve=new THREE.CatmullRomCurve3(pts);

// HEART MESH
const geometry=new THREE.TubeGeometry(curve,200,0.25,12,true);

const material=new THREE.MeshStandardMaterial({
  color:0xaeefff,
  emissive:0x3bdcff,
  emissiveIntensity:1.3,
  metalness:0.6,
  roughness:0.3
});

const heart=new THREE.Mesh(geometry,material);
scene.add(heart);

// ANIMATION
function animate(){
  requestAnimationFrame(animate);

  heart.rotation.y += 0.003;
  heart.rotation.x += 0.001;

  renderer.render(scene,camera);
}

animate();

// RESIZE
window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
