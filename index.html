<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Blue Heart</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
  radial-gradient(circle at center,
  #11233b 0%,
  #050b14 45%,
  #000000 100%);
}

/* صحنه */
.scene{
  position:relative;
  width:100%;
  height:100%;

  display:flex;
  justify-content:center;
  align-items:center;
}

/* نور پشت */
.glow{
  position:absolute;

  width:340px;
  height:340px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  rgba(80,190,255,.35) 0%,
  rgba(80,190,255,.08) 45%,
  transparent 70%);

  filter:blur(45px);

  animation:pulseGlow 4s ease-in-out infinite;
}

/* قلب */
.heart{
  position:relative;

  width:220px;

  z-index:5;

  animation:
  breathe 3s ease-in-out infinite,
  floating 5s ease-in-out infinite;

  filter:
  drop-shadow(0 0 8px #7fd3ff)
  drop-shadow(0 0 18px #4da6ff)
  drop-shadow(0 0 40px rgba(77,166,255,.55));
}

/* تصویر قلب */
.heart img{
  width:100%;
  display:block;
}

/* ذرات */
.particle{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#8ad7ff;

  box-shadow:
  0 0 8px #8ad7ff,
  0 0 18px #4da6ff;

  opacity:0;

  animation:
  particleMove linear infinite;
}

/* امضا */
.signature{
  position:fixed;
  bottom:12px;
  width:100%;

  text-align:center;

  color:rgba(180,220,255,.35);

  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:4px;
}

/* نفس کشیدن */
@keyframes breathe{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.05);
  }
}

/* شناور بودن */
@keyframes floating{

  0%,100%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-6px);
  }
}

/* نور */
@keyframes pulseGlow{

  0%,100%{
    opacity:.7;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.08);
  }
}

/* حرکت ذرات */
@keyframes particleMove{

  0%{
    transform:
    translate(0,0)
    scale(.2);

    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:
    translate(var(--x),var(--y))
    scale(1.4);

    opacity:0;
  }
}

</style>
</head>

<body>

<div class="scene">

<div class="glow"></div>

<div class="heart">

<img src="https://i.imgur.com/6qK0F9Y.png">

</div>

</div>

<div class="signature">MAMALI</div>

<script>

/* ساخت ذرات */
for(let i=0;i<60;i++){

  const p = document.createElement("div");

  p.className = "particle";

  p.style.left = "50%";
  p.style.top = "50%";

  p.style.setProperty(
    "--x",
    (Math.random()*280-140)+"px"
  );

  p.style.setProperty(
    "--y",
    (Math.random()*280-140)+"px"
  );

  p.style.animationDuration =
  (2+Math.random()*3)+"s";

  p.style.animationDelay =
  (Math.random()*3)+"s";

  document.body.appendChild(p);
}

</script>

</body>
</html>
