<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Blue Heart</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  width:100%;
  height:100vh;
  overflow:hidden;

  display:flex;
  justify-content:center;
  align-items:center;

  background:
  radial-gradient(circle at center,
  #14263d 0%,
  #07111d 40%,
  #000000 100%);
}

/* صحنه */
.scene{
  position:relative;
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* نور محیط */
.glow{
  position:absolute;

  width:350px;
  height:350px;

  border-radius:50%;

  background:
  radial-gradient(circle,
  rgba(90,180,255,.35) 0%,
  rgba(90,180,255,.08) 40%,
  transparent 70%);

  filter:blur(50px);

  animation:pulseGlow 4s ease-in-out infinite;
}

/* قلب */
.heart{
  position:relative;
  width:240px;
  z-index:5;

  animation:
  breathe 3s ease-in-out infinite,
  floating 5s ease-in-out infinite;

  filter:
  drop-shadow(0 0 10px #7fd3ff)
  drop-shadow(0 0 25px #4da6ff)
  drop-shadow(0 0 45px rgba(77,166,255,.55));
}

/* SVG */
svg{
  width:100%;
  height:auto;
}

/* ذرات */
.particle{
  position:absolute;

  width:3px;
  height:3px;

  border-radius:50%;

  background:#8fdcff;

  box-shadow:
  0 0 10px #8fdcff,
  0 0 20px #4da6ff;

  opacity:0;

  animation:
  particleMove linear infinite;
}

/* امضا */
.signature{
  position:fixed;
  bottom:12px;
  width:100%;

  text-align:center;

  color:rgba(180,220,255,.35);

  font-family:Arial,sans-serif;
  font-size:11px;
  letter-spacing:4px;
}

/* نفس */
@keyframes breathe{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.05);
  }
}

/* شناوری */
@keyframes floating{

  0%,100%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-6px);
  }
}

/* نور */
@keyframes pulseGlow{

  0%,100%{
    opacity:.7;
    transform:scale(1);
  }

  50%{
    opacity:1;
    transform:scale(1.08);
  }
}

/* ذرات */
@keyframes particleMove{

  0%{
    transform:
    translate(0,0)
    scale(.2);

    opacity:0;
  }

  20%{
    opacity:1;
  }

  100%{
    transform:
    translate(var(--x),var(--y))
    scale(1.4);

    opacity:0;
  }
}

</style>
</head>

<body>

<div class="scene">

<div class="glow"></div>

<div class="heart">

<!-- قلب SVG -->
<svg viewBox="0 0 512 512">

<defs>

<linearGradient id="heartGrad"
x1="0%" y1="0%"
x2="100%" y2="100%">

<stop offset="0%" stop-color="#c8f1ff"/>
<stop offset="35%" stop-color="#73cfff"/>
<stop offset="70%" stop-color="#338dff"/>
<stop offset="100%" stop-color="#1d4fff"/>

</linearGradient>

</defs>

<path fill="url(#heartGrad)"
d="
M256 480
C220 430 120 360 90 250
C65 160 120 80 200 90
C240 95 260 120 256 145
C252 120 272 95 312 90
C392 80 447 160 422 250
C392 360 292 430 256 480
"/>

</svg>

</div>

</div>

<div class="signature">SaLeNcE</div>

<script>

/* ذرات */
for(let i=0;i<65;i++){

  const p = document.createElement("div");

  p.className = "particle";

  p.style.left = "50%";
  p.style.top = "50%";

  p.style.setProperty(
    "--x",
    (Math.random()*320-160)+"px"
  );

  p.style.setProperty(
    "--y",
    (Math.random()*320-160)+"px"
  );

  p.style.animationDuration =
  (2+Math.random()*3)+"s";

  p.style.animationDelay =
  (Math.random()*3)+"s";

  document.body.appendChild(p);
}

</script>

</body>
</html>
