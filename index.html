<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Heart Fixed</title>
  <style>
    body { margin: 0; overflow: hidden; background: black; }
  </style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
let renderer = new THREE.WebGLRenderer({antialias:true});

renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// نور
let light = new THREE.PointLight(0xff3366, 2, 100);
light.position.set(0, 0, 10);
scene.add(light);

scene.add(new THREE.AmbientLight(0x550000));

// متریال براق
let material = new THREE.MeshStandardMaterial({
  color: 0xff1a4d,
  roughness: 0.3,
  metalness: 0.6
});

// قلب نرم‌تر
let heartShape = new THREE.Shape();

heartShape.moveTo(0, 0);
heartShape.bezierCurveTo(0, 2.5, -3, 2.5, -3, 0);
heartShape.bezierCurveTo(-3, -2, 0, -3.5, 0, -5);
heartShape.bezierCurveTo(0, -3.5, 3, -2, 3, 0);
heartShape.bezierCurveTo(3, 2.5, 0, 2.5, 0, 0);

let geometry = new THREE.ExtrudeGeometry(heartShape, {
  depth: 1.5,
  bevelEnabled: true,
  bevelSegments: 5,
  steps: 2,
  bevelSize: 0.5,
  bevelThickness: 0.5
});

let heart = new THREE.Mesh(geometry, material);
scene.add(heart);

camera.position.z = 10;

// انیمیشن
function animate() {
  requestAnimationFrame(animate);

  heart.rotation.y += 0.01;

  let t = Date.now() * 0.004;
  let beat = 1 + Math.sin(t) * 0.15 + Math.sin(t*2)*0.05;
  heart.scale.set(beat, beat, beat);

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
