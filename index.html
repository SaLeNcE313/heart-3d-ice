<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blue Shader Heart</title>
<style>
body { margin:0; overflow:hidden; background:black; }
canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);
camera.position.z = 10;

// Renderer
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

// Light
const light = new THREE.PointLight(0x4da6ff, 2);
light.position.set(5,5,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0x002244));

// Geometry (heart-like parametric shape)
let heartShape = new THREE.Shape();

heartShape.moveTo(0,0);
heartShape.bezierCurveTo(0,3,-4,3,-4,0);
heartShape.bezierCurveTo(-4,-3,0,-5,0,-7);
heartShape.bezierCurveTo(0,-5,4,-3,4,0);
heartShape.bezierCurveTo(4,3,0,3,0,0);

let geometry = new THREE.ExtrudeGeometry(heartShape,{
  depth:2,
  bevelEnabled:true,
  bevelSegments:10,
  steps:2,
  bevelSize:1,
  bevelThickness:1
});

// Blue glass-like material
let material = new THREE.MeshPhysicalMaterial({
  color:0x4da6ff,
  metalness:0.2,
  roughness:0.1,
  transmission:0.8,
  transparent:true,
  emissive:0x1a75ff,
  emissiveIntensity:0.7
});

let heart = new THREE.Mesh(geometry, material);
scene.add(heart);

// Animation (beat + glow feel)
function animate(){
  requestAnimationFrame(animate);

  let t = Date.now()*0.003;

  let beat = 1 + Math.sin(t)*0.08;

  heart.scale.set(beat,beat,beat);

  heart.rotation.y += 0.01;

  renderer.render(scene,camera);
}

animate();

window.addEventListener('resize',()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

</script>

</body>
</html>
